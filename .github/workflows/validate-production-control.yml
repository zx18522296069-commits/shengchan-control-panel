name: Validate Production Control Services

on:
  push:
    branches:
      - main
    paths-ignore:
      - backend/scheduler_state.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test backend
        run: |
          python -m pip install -r backend/requirements.txt
          python -m unittest discover -s backend -p 'test_*.py' -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test production API Worker scheduling and status parsing
        run: node worker/production-control-api/tests/worker.test.mjs

      - name: Build and validate Sites production API artifact
        working-directory: worker/production-control-api
        run: |
          npm run build
          npm run validate
